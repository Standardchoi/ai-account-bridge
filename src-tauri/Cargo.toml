[package]
name = "ai-account-bridge"
version = "0.3.2"
description = "ChatGPT(Codex)·Claude 데스크톱 앱의 계정 전환과 세션 이관 도구"
authors = ["Standardchoi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

# 설치본 크기를 줄인다
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
